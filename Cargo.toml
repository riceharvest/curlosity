[package]
name = "curlosity"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Batch web research: web_search + web_extract + curl in one tool call (web->web 64.7%). Pure Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/riceharvest/curlosity"
keywords = ["agentic","hermes","batch","tool"]
categories = ["development-tools"]

[[bin]]
name = "curlosity"
path = "src/main.rs"

[lib]
name = "curlosity"
path = "src/lib.rs"

[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread","macros","time","sync","fs","process","io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls","gzip","http2","json"] }
sha2 = "0.10"
url = "2.5"
flate2 = "1"
tar = "0.4"
scraper = "0.22"
ego-tree = "0.6"
htmd = "0.5"

tempfile = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
globset = "0.4.19"
clap_mangen = "0.3.3"
clap_complete = "4.6.9"
regex = "1.13.1"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
